apiVersion: apps/v1
kind: Deployment
metadata: {name: foundry-studio, labels: {app: foundry-studio}}
spec:
  replicas: 1
  strategy: {type: RollingUpdate}
  selector: {matchLabels: {app: foundry-studio}}
  template:
    metadata: {labels: {app: foundry-studio}}
    spec:
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: studio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [uvicorn, foundry_studio.app:app, --host, 0.0.0.0, --port, "8000"]
          envFrom: [{secretRef: {name: {{ .Values.envSecret }}}}]
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /, port: 8000}, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: foundry-studio}
spec:
  type: NodePort
  selector: {app: foundry-studio}
  ports: [{name: http, port: 8000, targetPort: 8000, nodePort: {{ .Values.nodePort }}}]
